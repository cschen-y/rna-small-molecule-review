name: MVRBind
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10.18
  - pip
  - numpy=1.23.5
  - pandas=2.3.1
  - scipy=1.15.3
  - scikit-learn=1.7.0
  - networkx=2.8
  - biopython=1.85
  - matplotlib=3.10.3
  - tqdm=4.67.1
  - requests=2.32.4
  - pytorch=2.2.0
  - torchvision=0.17.0
  - pytorch-cuda=12.1
  - pip:
      - --find-links https://data.pyg.org/whl/torch-2.2.0+cu121.html
      - torch-geometric==2.6.1
      - torch-cluster==1.6.3+pt22cu121
      - torch-scatter==2.1.2+pt22cu121
      - torch-sparse==0.6.18+pt22cu121
      - torch-spline-conv==1.2.2+pt22cu121
      - rdkit==2023.9.6
      - loguru==0.7.3
      - selenium==4.34.2
